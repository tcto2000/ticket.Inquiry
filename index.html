<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登記結果查詢｜絲竹之火－2026菁音系列音樂會</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#f3e6d9; --bg2:#efeae4;
    --card:#fcfaf8; --ink:#5a4134; --ink-2:#8a766a; --muted:#9b8a7f;
    --accent:#a0603c; --title:#7a4a30; --line:#e6d6c8; --field:#d8ccc3;
    --btn1:#efcfb2; --btn2:#dea67c;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:32px 16px;
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1200px 600px at 0% 0%, var(--bg1), transparent 60%),
      radial-gradient(900px 600px at 100% 100%, #f1ece6, transparent 60%),
      var(--bg2);
  }
  .card{
    width:100%; max-width:440px;
    background:var(--card); border-radius:28px;
    padding:44px 36px 36px;
    box-shadow:0 30px 60px -30px rgba(120,80,50,.25), 0 0 0 1px rgba(255,255,255,.8) inset;
    text-align:center;
  }
  .logo{display:block; width:78%; max-width:300px; height:auto; margin:0 auto 32px}
  .eyebrow{
    font-size:12px; font-weight:700; letter-spacing:.22em; color:var(--accent);
    margin:0 0 6px;
  }
  h1{font-size:38px; font-weight:700; letter-spacing:.08em; margin:0; line-height:1.15; color:var(--title)}
  .sub{font-size:16px; letter-spacing:.12em; color:var(--ink-2); margin:6px 0 32px}

  .divider{display:flex; align-items:center; gap:14px; color:var(--ink-2); font-size:13px; margin:0 0 22px}
  .divider::before,.divider::after{content:""; flex:1; height:1px; background:var(--line)}

  label{display:block; text-align:left; font-weight:500; font-size:15px; color:var(--ink-2); margin:0 0 10px}
  input{
    width:100%; height:52px; padding:0 18px;
    font:inherit; font-size:17px; color:var(--ink);
    background:#fffdfb; border:1px solid var(--field); border-radius:14px;
    outline:none; transition:border-color .15s, box-shadow .15s;
  }
  input::placeholder{color:#c4b6ac}
  input:focus{border-color:#cf9a73; box-shadow:0 0 0 4px rgba(222,166,124,.18)}
  .hint{text-align:left; font-size:13px; color:var(--muted); margin:10px 0 24px}

  button{
    width:100%; height:54px; border:0; border-radius:14px; cursor:pointer;
    font:inherit; font-size:18px; font-weight:500; color:#6e3f24; letter-spacing:.1em;
    background:linear-gradient(135deg,var(--btn1),var(--btn2));
    box-shadow:0 10px 20px -12px rgba(170,100,60,.6);
    transition:transform .1s, filter .15s;
  }
  button:hover{filter:brightness(1.03)}
  button:active{transform:translateY(1px)}
  button:disabled{cursor:default; color:#a99488; background:linear-gradient(135deg,#f4e3d6,#efd8c6); box-shadow:none}

  .msg{min-height:1.4em; margin:16px 0 0; font-size:14px; font-weight:500; color:#a2462a}

  .result{margin-top:8px; text-align:left}
  .result h2{font-size:13px; font-weight:700; letter-spacing:.18em; color:var(--accent); margin:0 0 12px}
  .item{border:1px solid var(--line); border-radius:16px; background:#fffdfb; padding:4px 20px; margin-bottom:12px}
  .row{display:flex; justify-content:space-between; align-items:baseline; gap:16px; padding:14px 0}
  .row + .row{border-top:1px solid #f0e6dd}
  .k{color:var(--ink-2); font-size:14px}
  .v{font-size:17px; font-weight:500; color:var(--ink); text-align:right}
  .v.big{font-size:17px; font-weight:700; color:var(--accent)}

  .foot{font-size:13px; line-height:1.8; color:var(--ink-2); margin:28px 0 0}
  @media (max-width:420px){ .card{padding:36px 22px 28px} h1{font-size:33px} }
</style>
</head>

  <p class="eyebrow">2026 菁音系列音樂會</p>
  <h1>絲竹之火</h1>
  <p class="sub">登記結果查詢</p>

  <div class="divider">請輸入登記時填寫的姓名</div>

  <label for="name">姓名</label>
  <input id="name" autocomplete="name" placeholder="例：王小明">
  <p class="hint">為保護個人資料，查詢結果中的姓名會部分遮蔽。</p>

  <button id="btn" type="button">查詢</button>
  <p class="msg" id="msg" role="status" aria-live="polite"></p>

  <section class="result" id="result" hidden>
    <h2>查詢結果</h2>
    <div id="out"></div>
  </section>

  <p class="foot">同名者將分別列出。<br>如查無資料或有疑問，請洽臺南市民族管絃樂團。</p>
</main>

<script>
const API = 'https://script.google.com/macros/s/AKfycbyT6zSrwUJHkzqSRnc4xJgHO0Jk074wY3DmuzGXJxujdddD0RtMuz7awOLmvsa2a4OS/exec';

const $ = id => document.getElementById(id);
$('btn').addEventListener('click', go);
$('name').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) go(); });

// 預熱：開頁時先喚醒後端並載入快取，第一次查詢會比較快
fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: '{"warm":1}' }).catch(() => {});

async function go() {
  const name = $('name').value.trim();
  const btn = $('btn');
  $('msg').textContent = '';
  $('out').innerHTML = '';
  $('result').hidden = true;
  if (!name) { $('msg').textContent = '請輸入姓名'; $('name').focus(); return; }

  btn.disabled = true; btn.textContent = '查詢中…';
  try {
    const res = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ name })
    }).then(r => r.json());

    if (!res.ok) { $('msg').textContent = res.msg; return; }

    res.results.forEach(pairs => {
      const item = document.createElement('div');
      item.className = 'item';
      pairs.forEach(([k, v]) => {
        const row = document.createElement('div'); row.className = 'row';
        const kk = document.createElement('span'); kk.className = 'k'; kk.textContent = k.includes('張數') ? '登記張數' : k;
        const vv = document.createElement('span'); vv.className = 'v';
        if (k.includes('張數')) { vv.classList.add('big'); vv.textContent = /^\d+$/.test(v) ? v + ' 張' : (v || '—'); }
        else vv.textContent = v || '—';
        row.append(kk, vv); item.append(row);
      });
      $('out').append(item);
    });
    $('result').hidden = false;
  } catch (err) {
    $('msg').textContent = '連線失敗，請稍後再試';
  } finally {
    btn.disabled = false; btn.textContent = '查詢';
  }
}
</script>
</body>
